<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #BB0000;
    --red-bright: #CC0000;
    --black: #000000;
    --gray-900: #080808;
    --gray-800: #111111;
    --gray-700: #1c1c1c;
    --gray-400: #555;
    --gray-200: #aaaaaa;
    --white: #f2eeea;
    --F: 'Bebas Neue', sans-serif;
    --FB: 'DM Sans', sans-serif;
    --FM: 'Space Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--FB);
    font-weight: 300;
    overflow-x: hidden;
    cursor: none;
  }
  a { text-decoration: none; }

  /* CURSOR */
  #cursor-dot {
    position: fixed; width: 8px; height: 8px;
    background: var(--red); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
  }
  #cursor-ring {
    position: fixed; width: 34px; height: 34px;
    border: 1.5px solid rgba(187,0,0,.5); border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: all .14s ease;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 60px;
    background: rgba(0,0,0,.97);
  }
  .nav-logo-img { height: 40px; }
  .nav-links { display: flex; gap: 44px; list-style: none; }
  .nav-links a {
    font-family: var(--FM); font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--gray-200);
    position: relative; transition: color .2s;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 1px; background: var(--red);
    transition: width .28s ease;
  }
  .nav-links a:hover { color: var(--white); }
  .nav-links a:hover::after { width: 100%; }

  /* BACK BUTTON */
  .back-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--FM); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--red);
    cursor: none; transition: gap .2s;
    margin-bottom: 48px;
  }
  .back-btn:hover { gap: 16px; }
  .back-btn::before { content: '←'; font-size: 14px; }

  /* HERO PROJET */
  .projet-hero {
    padding: 140px 60px 80px;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; align-items: center;
    position: relative; overflow: hidden;
  }
  .projet-hero::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(187,0,0,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(187,0,0,.03) 1px, transparent 1px);
    background-size: 56px 56px;
    pointer-events: none;
  }

  .projet-eyebrow {
    font-family: var(--FM); font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--red);
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
  }
  .projet-eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--red); display: block; }

  .projet-title {
    font-family: var(--F);
    font-size: clamp(48px, 6vw, 86px);
    line-height: .9; letter-spacing: 1px; margin-bottom: 28px;
  }
  .projet-title .red { color: var(--red); }

  .projet-desc {
    font-size: 15px; line-height: 1.85; color: var(--gray-200); margin-bottom: 36px;
  }

  .projet-tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag {
    font-family: var(--FM); font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--white);
    border: 1px solid rgba(187,0,0,.4);
    padding: 7px 14px; background: rgba(187,0,0,.08);
  }

  /* IMAGE PRINCIPALE */
  .projet-img-main {
    background: var(--gray-80); border:none;
    aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  
  .projet-img-main svg { position: relative; z-index: 1; width: 70%; height: 70%; opacity: .2; }
  .img-label {
    position: absolute; bottom: 16px; right: 16px;
    font-family: var(--FM); font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gray-400);
  }

  

 
 
  

  /* FOOTER */
  footer {
    background: var(--gray-900); border-top: 1px solid rgba(187,0,0,.15);
    padding: 44px 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .footer-logo img { height: 34px; }
  .footer-text { font-family: var(--FM); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-400); }
  .footer-links { display: flex; gap: 28px; }
  .footer-links a { font-family: var(--FM); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-400); transition: color .2s; cursor: none; }
  .footer-links a:hover { color: var(--red); }

  /* ANIMATIONS */
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }
  .reveal-delay-1 { transition-delay: .1s; }
  .reveal-delay-2 { transition-delay: .2s; }
  .reveal-delay-3 { transition-delay: .32s; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    nav { padding: 18px 24px; }
    .nav-links { display: none; }
    .projet-hero { grid-template-columns: 1fr; padding: 120px 24px 60px; gap: 40px; }
    .specs-grid { grid-template-columns: 1fr 1fr; }
    .gallery-grid { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .specs-section, .detail-section { padding: 60px 24px; }
    .cta-section { flex-direction: column; gap: 32px; padding: 60px 24px; text-align: center; }
    footer { flex-direction: column; gap: 20px; padding: 36px 24px; text-align: center; }
    body { cursor: auto; }
    #cursor-dot, #cursor-ring { display: none; }
  }
</style>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-brand">
    <img src="nkam-logo-dark.png" alt="NKAM" class="nav-logo-img">
  </a>
  <ul class="nav-links">
     <li><a href="index.html#about">À propos</a></li>
    <li><a href="photonique.html">Photonique</a></li>
    <li><a href="index.html#portfolio">Portfolio</a></li>
    <li><a href="index.html#team">Équipe</a></li>
    <li><a href="philosophie.html">Philosophie</a></li>
    
  </ul>
</nav>

<!-- HERO PROJET -->
<section class="projet-hero">
  <div>
    
    <h1 class="projet-title">ERROR<br><span class="red">404</span><br></h1>
    <p class="projet-desc">
      Cette page n'existe pas - This page do not existe - Diese Seite existiert nicht
    </p>
    
  </div>

  <div class="projet-img-main">
    <img src="nkam-logo-dark.png" alt="logo"
             style="width:100%; height:100%; object-fit:cover;">
    <img>
    
  </div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo"><img src="nkam-logo-dark.png" alt="NKAM"></div>
  <div class="footer-text">© 2026 NKAM — Tous droits réservés</div>
  <div class="footer-links">
    <a href="index.html#about">À propos</a>
    <a href="index.html#portfolio">Portfolio</a>
    
  </div>
</footer>

<script>
  // Cursor
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let mx = -200, my = -200, rx = -200, ry = -200;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  (function loop() {
    dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    rx += (mx - rx) * .14; ry += (my - ry) * .14;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    requestAnimationFrame(loop);
  })();

  // Scroll reveal
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
</script>
</body>
</html>
